{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header">
    <h5 class="mb-0">{{ title }}</h5>
  </div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Employee</label>
          {{ form.employee }}
        </div>
        <div class="col-md-3">
          <label class="form-label">Date</label>
          {{ form.date }}
        </div>
        <div class="col-md-3">
          <label class="form-label">Duration</label>
          {{ form.duration }}
        </div>
        <div class="col-md-3">
          <label class="form-label">Clock In</label>
          {{ form.clock_in }}
        </div>
        <div class="col-md-3">
          <label class="form-label">Clock Out</label>
          {{ form.clock_out }}
        </div>
        <div class="col-12">
          <label class="form-label">Note</label>
          {{ form.note }}
        </div>
      </div>
      <div class="mt-3">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'employees:attendance_list' %}" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
